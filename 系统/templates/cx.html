{% extends 'base.html' %}
{% block pagewra %}
    <script src="../static/echarts/js/echarts.min.js"></script>
    <!--page-wrapper-->
    <div class="page-wrapper">
        <!--page-content-wrapper-->
        <div class="page-content-wrapper">
            <div class="page-content">
                <div class="row">
                    <div class="col-12 col-lg-12">
                        <div class="card radius-15">
                            <div class="card-body">
                                <div id="chart1" style="height: 700px;width: 100%"></div>
                                <script>
                                    var chartDom = document.getElementById('chart1');
                                    var myChart = echarts.init(chartDom, 'light');
                                    var option;
                                    option = {
                                        title: {
                                            text: '不同朝向平均价格(元/㎡)'
                                        },
                                        tooltip: {
                                            trigger: 'axis',
                                            axisPointer: {
                                                type: 'shadow'
                                            }
                                        },
                                        legend: {},
                                        xAxis: [
                                            {
                                                type: 'category',
                                                axisTick: {show: false},
                                                data: {{ data[0]|tojson }}
                                            }
                                        ],
                                        yAxis: [
                                            {
                                                type: 'value'
                                            }
                                        ],
                                        series: [
                                            {
                                                name: '朝向',
                                                type: 'bar',
                                                barGap: 0,
                                                emphasis: {
                                                    focus: 'series'
                                                },
                                                data: {{ data[1]|tojson }}
                                            }
                                        ]
                                    };

                                    option && myChart.setOption(option);

                                </script>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <!--end page-content-wrapper-->
    </div>
    <!--end page-wrapper-->
    <script src="../static/assets/js/jquery.min.js"></script>
    <script src="../static/assets/plugins/select2/js/select2.min.js"></script>
    <script src="../static/echarts/js/echarts.min.js"></script>
{% endblock %}
