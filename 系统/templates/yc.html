{% extends 'base.html' %}
{% block pagewra %}
    <div class="container mt-5">
        <h2>房价预测</h2>
        <form id="predictionForm">

            <div class="form-group">
                <label for="huxing">户型</label>
                <select class="form-control" id="huxing" name="huxing">
                    <option value="1室0厅">1室0厅</option>
                    <option value="1室1厅">1室1厅</option>
                    <option value="2室1厅">2室1厅</option>
                    <option value="2室2厅">2室2厅</option>
                    <option value="3室1厅">3室1厅</option>
                    <option value="3室2厅">3室2厅</option>
                    <option value="4室1厅">4室1厅</option>
                    <option value="4室2厅">4室2厅</option>
                    <option value="5室2厅">5室2厅</option>
                </select>
            </div>
            <div class="form-group">
                <label for="chaoxiang">面积</label>
                <input type="number" class="form-control" id="mianji" name="mianji">
            </div>
            <div class="form-group">
                <label for="louceng">楼层</label>
                <select class="form-control" id="louceng" name="louceng">
                    <option value="低楼层">低楼层</option>
                    <option value="中楼层">中楼层</option>
                    <option value="高楼层">高楼层</option>
                </select>
            </div>
                        <div class="form-group">
                <label for="louceng">楼层类型</label>
                <select class="form-control" id="lclx" name="lclx">
                    <option value="板楼">板楼</option>
                    <option value="板塔结合">板塔结合</option>
                    <option value="塔楼">塔楼</option>
                    <option value="平房">平房</option>
                </select>
            </div>
            <div class="form-group">
                <label for="louceng">装修</label>
                <select class="form-control" id="zx" name="zx">
                    <option value="精装">精装</option>
                    <option value="简装">简装</option>
                    <option value="毛坯">毛坯</option>
                </select>
            </div>
            <div class="form-group">
                <label for="chaoxiang">朝向</label>
                <select class="form-control" id="chaoxiang" name="chaoxiang">
                    <option value="南">南</option>
                    <option value="东">东</option>
                    <option value="西">西</option>
                    <option value="北">北</option>
                </select>
            </div>
            <div class="form-group">
                <label for="qy">区域</label>
                <select class="form-control" id="qy" name="qy">
                    <option value="红谷滩区">红谷滩区</option>
                    <option value="新建区">新建区</option>
                    <option value="青山湖区">青山湖区</option>
                    <option value="青云谱区">青云谱区</option>
                    <option value="西湖区">西湖区</option>
                    <option value="东湖区">东湖区</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">预测</button>
        </form>
    </div>
    <script src="../static/assets/js/jquery.min.js"></script>
    <script src="../static/assets/plugins/select2/js/select2.min.js"></script>
    <script src="../static/echarts/js/echarts.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#predictionForm').on('submit', function (e) {
                e.preventDefault();

                var formData = $(this).serialize();

                $.ajax({
                    url: '/yc',
                    type: 'POST',
                    data: formData,
                    success: function (response) {

                        // 显示预测结果
                        alert('预测结果: ' + response.dt_pred.toFixed(2) + ' 万元');
                    },
                    error: function () {
                        alert('预测失败，请重试！');
                    }
                });
            });
        });
    </script>
{% endblock %}
