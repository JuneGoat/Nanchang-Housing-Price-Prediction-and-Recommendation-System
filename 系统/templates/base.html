<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content=""/>

<body>

<!-- Start wrapper-->
<div id="wrapper">

    <!--Start sidebar-wrapper-->
    <div id="sidebar-wrapper" data-simplebar="" data-simplebar-auto-hide="true">
        <div class="brand-logo">
            <h5 class="logo-text">南昌房价</h5>
        </div>
        <ul class="sidebar-menu do-nicescrol">

            <li class="sidebar-header">数据查看</li>
            <li>
                <a href="all_house" class="waves-effect">
                    <i class="zmdi zmdi-view-dashboard"></i> <span>所有数据</span>
                </a>
            </li>
            <li>
                <a href="user_house" class="waves-effect">
                    <i class="zmdi zmdi-view-dashboard"></i> <span>我的收藏</span>
                </a>
            </li>
            <li>
                <a href="tj_house" class="waves-effect">
                    <i class="zmdi zmdi-view-dashboard"></i> <span>推荐数据</span>
                </a>
            </li>
            <li class="sidebar-header">数据可视化</li>
            <li>
                <a href="lc" class="waves-effect">
                    <i class="zmdi zmdi-gamepad"></i> <span>楼层分析</span>
                </a>
            </li>
            <li>
                <a href="qy" class="waves-effect">
                    <i class="zmdi zmdi-chart"></i> <span>区域分析</span>
                </a>
            </li>


            <li>
                <a href="hx" class="waves-effect">
                    <i class="zmdi zmdi-email"></i>
                    <span>户型分析</span>
                </a>
            </li>
            <li>
                <a href="cx" class="waves-effect">
                    <i class="zmdi zmdi-format-list-bulleted"></i> <span>朝向</span>
                </a>
            </li>
            <li>
                <a href="tz" class="waves-effect">
                    <i class="zmdi zmdi-format-list-bulleted"></i> <span>特征分析</span>
                </a>
            </li>

            <li class="sidebar-header">算法分析</li>
            <li>
                <a href="yc" class="waves-effect">
                    <i class="zmdi zmdi-grid"></i> <span>算法预测</span>
                </a>
            </li>
            <li>
                <a href="result" class="waves-effect">
                    <i class="zmdi zmdi-grid"></i> <span>模型对比</span>
                </a>
            </li>

            <li class="sidebar-header">更多</li>
            <li>
                <a href="/logout" class="waves-effect">
                    <i class="fa fa-share"></i> <span>退出登录</span>
                </a>
            </li>

        </ul>

    </div>
    <!--End sidebar-wrapper-->

    <!--Start topbar header-->
    <header class="topbar-nav">
        <nav class="navbar navbar-expand fixed-top bg-white">
        </nav>
    </header>
    <div class="clearfix"></div>

    <div class="content-wrapper">
        <div class="container-fluid">
            {% block pagewra %}
            {% endblock %}

        </div>
    </div>
