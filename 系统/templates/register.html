<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title></title>
    <!-- Bootstrap core CSS-->
    <link href="../static/assets/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- animate CSS-->
    <link href="../static/assets/css/animate.css" rel="stylesheet" type="text/css"/>
    <!-- Icons CSS-->
    <link href="../static/assets/css/icons.css" rel="stylesheet" type="text/css"/>
    <!-- Custom Style-->
    <link href="../static/assets/css/app-style.css" rel="stylesheet"/>
</head>
<body class="bg-dark">
<!-- Start wrapper-->
<div id="wrapper">
    <div class="card card-authentication1 mx-auto my-5">
        <div class="card-body">
            <div class="card-content p-2">
                <div class="card-title text-uppercase text-center py-3">用户注册</div>
                <div class="form-group">
                    <label for="exampleInputName" class="">用户名</label>
                    <div class="position-relative has-icon-right">
                        <input style="color: black" type="text" id="username" class="form-control input-shadow"
                               placeholder="请输入用户名">
                        <div class="form-control-position">
                            <i class="icon-user"></i>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword" class="">密码</label>
                    <div class="position-relative has-icon-right">
                        <input style="color: black" type="password" id="password" class="form-control input-shadow"
                               placeholder="请输入密码">
                        <div class="form-control-position">
                            <i class="icon-lock"></i>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword" class="">确认密码</label>
                    <div class="position-relative has-icon-right">
                        <input style="color: black" type="password" id="repassword" class="form-control input-shadow"
                               placeholder="再次输入密码">
                        <div class="form-control-position">
                            <i class="icon-lock"></i>
                        </div>
                    </div>
                </div>
                <button type="button" onclick="res()"
                        class="btn btn-primary shadow-primary btn-block waves-effect waves-light">注册
                </button>
            </div>
        </div>
        <div class="card-footer text-center py-3">
            <p class="text-muted mb-0">已经有账号了?<a href="/"> 登录</a>
            </p>
        </div>
    </div>
</div><!--wrapper-->

<!-- Bootstrap core JavaScript-->
<script src="../static/assets/js/jquery.min.js"></script>
<script src="../static/assets/js/popper.min.js"></script>
<script src="../static/assets/js/bootstrap.min.js"></script>
<script>
    function res() {
        if (document.getElementById('password').value != document.getElementById('repassword').value) {
            alert('两次输入的密码不同')
            location.reload()
        } else {
            if (document.getElementById('username').value === '' || document.getElementById('password').value === '') {
                alert('请输入完整数据')
            } else {
                var data = {
                    'username': document.getElementById('username').value,
                    'password': document.getElementById('password').value,
                }
                $.ajax({
                    url: "register",
                    type: "post",
                    data: {'data': JSON.stringify(data)},
                    success: function (e) {
                        data = JSON.parse(e)
                        alert(data.info)
                        if (data.info == '注册成功') {
                            location.href = '/'
                        }
                    }
                })
            }
        }
    }
</script>
</body>
</html>
