{% extends 'base.html' %}
{% block pagewra %}
    <style>
        .recommend-reason {
            color: #666;
            font-size: 0.9em;
            cursor: help;
        }

        .recommend-reason i {
            margin-right: 5px;
            color: #4e73df;
        }

        .reason-text {
            vertical-align: middle;
        }
    </style>
    <!--page-wrapper-->
    <div class="page-wrapper">
        <!--page-content-wrapper-->
        <div class="page-content-wrapper">
            <div class="page-content">
                <div class="user-profile-page">
                    <div class="card radius-15">
                        <div class="card-body">
                            <div class="card-title">
                                <h4 class="mb-0">为您推荐的房源</h4>
                                <p class="mb-0 text-muted">根据您的收藏记录精心挑选</p>
                            </div>
                            <hr/>

                            <!-- 推荐数据表格 -->
                            <div class="table-responsive">
                                <table id="example" class="table table-striped table-bordered" style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>标题</th>
                                        <th>区域</th>
                                        <th>总价</th>
                                        <th>单价</th>
                                        <th>户型</th>
                                        <th>面积</th>
                                        <th>推荐理由</th>
                                        <th>操作</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    {% for house in data %}
                                        <tr>
                                            <td>{{ house[1] }}</td>
                                            <td>{{ house[2] }}</td>
                                            <td>{{ house[3] }}</td>
                                            <td>{{ house[4] }}</td>
                                            <td>{{ house[5] }}</td>
                                            <td>{{ house[6] }}</td>
                                            <td>
                                                <div class="recommend-reason">
                                                    <i class="zmdi zmdi-info-outline"></i>
                                                    <span class="reason-text">
                    {{ house[12] if house|length > 12 else "为您精心挑选的优质房源" }}
                </span>
                                                </div>
                                            </td>
                                            <td>
                                                <button class="btn btn-primary btn-sm add-favorite"
                                                        data-id="{{ house[0] }}">
                                                    收藏
                                                </button>
                                            </td>
                                        </tr>
                                    {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../static/assets/js/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // 收藏按钮点击事件
            $('.add-favorite').click(function () {
                var data_id = $(this).data('id');
                var button = $(this);

                $.ajax({
                    url: '/add_favorite',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        user_id: "{{ session.get('user_id') }}",
                        data_id: data_id
                    }),
                    success: function (response) {
                        alert(response.message);
                        if (response.success) {
                            button.prop('disabled', true).text('已收藏');
                        }
                    },
                    error: function () {
                        alert('操作失败，请重试');
                    }
                });
            });
        });
    </script>
{% endblock %}
